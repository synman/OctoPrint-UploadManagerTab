[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-UploadManagerTab"
version = "0.1.0"
description = "Shows OctoPrint's Upload Manager in a tab instead of a dialog"
authors = [
    { name = "Shell M. Shrader", email = "shell@shellware.com" },
]
requires-python = ">=3.7,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
uploadmanagertab = "octoprint_uploadmanagertab"

[project.urls]
Homepage = "https://github.com/synman/OctoPrint-UploadManagerTab"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_uploadmanagertab",
    "octoprint_uploadmanagertab.*",
]
